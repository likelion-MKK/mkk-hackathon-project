name: Contract checks

on:
  pull_request:
    paths:
      - "contracts/**"
      - "data/lookbooks/**"
      - "data/products/**"
      - "apps/kiosk/public/media/**"
      - "scripts/validate_contracts.py"
      - "scripts/verify_product_assets.py"
      - "tests/contract/test_product_assets.py"
      - "requirements-contracts.txt"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "data/lookbooks/**"
      - "data/products/**"
      - "apps/kiosk/public/media/**"
      - "scripts/validate_contracts.py"
      - "scripts/verify_product_assets.py"
      - "tests/contract/test_product_assets.py"
      - "requirements-contracts.txt"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

concurrency:
  group: contract-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-contracts.txt

      - name: Install contract dependencies
        run: python -m pip install --requirement requirements-contracts.txt

      - name: Validate schemas and examples
        run: python scripts/validate_contracts.py

      - name: Verify reviewed product assets
        run: |
          python scripts/verify_product_assets.py
          python tests/contract/test_product_assets.py
