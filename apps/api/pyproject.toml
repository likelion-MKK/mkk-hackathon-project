[project]
name = "mcm-lookbook-api"
version = "0.1.0"
description = "Contract-first FastAPI backend scaffold for the MCM AI Lookbook Kiosk"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["../.."]
