[project]
name = "mcm-eye"
version = "0.1.0"
description = "Eye Adapter boundary for the MCM AI Lookbook Kiosk"
readme = "README.md"
requires-python = "==3.13.14"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
