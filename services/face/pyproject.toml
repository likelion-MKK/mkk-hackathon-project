[project]
name = "mcm-face-service"
version = "0.1.0"
description = "Face adapter boundary for the MCM AI Lookbook Kiosk"
requires-python = "==3.13.15"
dependencies = []

[project.optional-dependencies]
camera = [
    "mediapipe==1.0.0",
]

[project.scripts]
camera-smoke-test = "mcm_face.cli:camera_smoke_main"
camera-preview = "mcm_face.cli:camera_preview_main"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcm_face"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
